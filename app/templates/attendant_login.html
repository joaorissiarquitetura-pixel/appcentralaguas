{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-1">Portal do atendente</h1>
        <p class="text-muted mb-3">Lançar compras e resgates.</p>

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/atendente/login" class="vstack gap-3">
          <div>
            <label class="form-label">Email</label>
            <input class="form-control" name="email" type="email" required>
          </div>
          <div>
            <label class="form-label">Senha</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>

        <hr class="my-4">
        <div class="text-muted small d-grid gap-1">
          <span>Depois de entrar, o painel administrativo fica em <strong>/admin</strong>.</span>
          <span>Se o acesso do admin não funcionar, posso te passar uma senha temporária local.</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
