{% extends "base.html" %}
{% block content %}
<style>
    .change-password-wrapper {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .change-password-card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 25px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 460px;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px 15px;
        border: 1px solid #dee2e6;
    }
</style>

<div class="container change-password-wrapper">
    <div class="change-password-card p-4 p-md-5">
        <div class="text-center mb-4">
            <img src="/static/img/logo_central.jpg" height="65" class="mb-3" alt="Logo Central Águas">
            <h1 class="h4 fw-bold text-primary">Troque sua senha</h1>
            <p class="text-muted small mb-0">
                Sua senha foi redefinida pela equipe e precisa ser alterada por segurança.
            </p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 rounded-3 small py-2 mb-4 text-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/alterar-senha-obrigatoria" class="vstack gap-3">
            <div>
                <label class="form-label small fw-bold text-muted">Nova senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-lock"></i></span>
                    <input class="form-control border-start-0 rounded-end-3" name="password" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4 dígitos" required>
                </div>
            </div>

            <div>
                <label class="form-label small fw-bold text-muted">Confirmar nova senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-shield-lock"></i></span>
                    <input class="form-control border-start-0 rounded-end-3" name="confirm_password" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4 dígitos" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm mt-2">
                Salvar nova senha
            </button>
        </form>
    </div>
</div>
{% endblock %}
